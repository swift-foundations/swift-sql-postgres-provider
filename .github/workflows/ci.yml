name: CI

# Thin package caller. Per the three-tier chain
# (package thin caller -> layer wrapper -> universal reusable) this file owns
# only admitted events, concurrency, a `uses:` job and typed inputs. No
# `runs-on`, steps, tool setup, matrix, or validation predicate belongs here.
#
# Both `uses:` references below float on `@main`, permanently, with no pin
# and no override path — the Institute's standing intra-Institute
# reusable-workflow doctrine (`swift-institute/Skills` `ci-cd/SKILL.md`;
# `swift-institute/.github#107` closed `not planned`).
#
# ---------------------------------------------------------------------------
# Linux and Windows are expected RED until the transport is composed
# ---------------------------------------------------------------------------
# `Postgres.Provider.Session` calls the kernel through an unconditional
# `import Darwin` (socket/connect/read/write/poll/close) with no
# `#if canImport` anywhere in the package. It therefore cannot compile off
# Apple platforms today. That is a known defect with a filed plan, not a
# surprise: the transport is being split from the wire protocol and re-pointed
# at swift-posix / swift-iso-9945, which carry the portability layer.
# Tracking: swift-institute/Workspace#50 (step 3), swift-institute/Issues#60.
#
# `platform-support` is deliberately NOT narrowed to `apple` to make those legs
# green. That input declares platform-IDENTITY exclusions — a package whose
# specification excludes a platform — and is explicitly not a cost knob and not
# derived from `Package.swift` `platforms:`. This package's macOS-only state is
# a defect being repaired, not an identity, so narrowing the matrix would
# convert a true red into a false green and hide the exact signal the repair
# needs. The full matrix stays; the red is honest and actionable.
#
# This is also the first CI this package has ever had. It carries a conformant
# `Lint.swift`, `metadata.yaml`, LICENSE and README, and has nonetheless never
# been built by anything but a laptop — "has a workflow" and "has ever verified
# anything" are different properties, and until this commit it had neither.

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build + test matrix — swift-foundations/.github/.github/workflows/swift-ci.yml (layer wrapper)
  ci:
    uses: swift-foundations/.github/.github/workflows/swift-ci.yml@main
    secrets: inherit

  # DocC umbrella-catalog pipeline — swift-foundations/.github/.github/workflows/swift-docs.yml
  docs:
    uses: swift-foundations/.github/.github/workflows/swift-docs.yml@main
    secrets: inherit
